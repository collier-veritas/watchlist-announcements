name: Watchlist Announcements

on:
  schedule:
    # Every 5 min, 7am-8pm Sydney Mon-Fri (UTC ranges cover both AEST and AEDT;
    # main.py enforces the exact Sydney window). GitHub may run these late.
    - cron: "*/5 20-23 * * 0-4"
    - cron: "*/5 0-9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run outside the Sydney window"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check and send
        env:
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: python main.py ${{ inputs.force && '--force' || '' }}
      - name: Save sent-log
        if: always()
        run: |
          git config user.name "veritas-ai-bot"
          git config user.email "veritas-ai-bot@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet && exit 0
          git commit -m "state: sent-log"
          git pull --rebase
          git push
