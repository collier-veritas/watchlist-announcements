name: Watchlist Announcements

on:
  schedule:
    # Backup only. GitHub drops most of these, so cron-job.org is the real
    # trigger: it calls the workflow_dispatch API every 5 min, 7am-8pm Sydney
    # Mon-Fri. UTC ranges cover both AEST and AEDT; main.py enforces the
    # exact Sydney window.
    - cron: "*/5 20-23 * * 0-4"
    - cron: "*/5 0-9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run outside the Sydney window"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tip of main, not the trigger-time SHA: a run queued behind another must
      # see the sent-log that run pushed, or it re-sends the same announcements.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check and send
        env:
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: python main.py ${{ inputs.force && '--force' || '' }}
      - name: Save sent-log
        if: always()
        run: |
          git config user.name "veritas-ai-bot"
          git config user.email "veritas-ai-bot@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet && exit 0
          git commit -m "state: sent-log"
          git pull --rebase
          git push
